<!DOCTYPE html>

<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Loading...</title>

  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
    }

    body {
      background: #0066ff;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-family: Arial, Helvetica, sans-serif;
    }

    #loading {
      font-size: 8vw;
      font-weight: bold;
      text-align: center;
      user-select: none;
    }
  </style>

</head>

<body>
  <div id="loading">Fetching....</div>

  <script>
    (async () => {
      try {
        // a.html を取得している間は Fetching.... を表示
        const response = await fetch("./e112u3.html");

        if (!response.ok) {
          throw new Error(`e112.html の読み込みに失敗しました: ${response.status}`);
        }

        const html = await response.text();

        // about:blank を新しいタブ/ウィンドウで開く
        const newWindow = window.open("about:blank", "_blank");

        if (!newWindow) {
          throw new Error(
            "新しいウィンドウを開けませんでした。ポップアップがブロックされている可能性があります。"
          );
        }

        // a.html の内容を about:blank に埋め込む
        newWindow.document.open();
        newWindow.document.write(html);
        newWindow.document.close();

      } catch (error) {
        console.error(error);

        document.getElementById("loading").textContent =
          "Fetch failed.";
      }
    })();
  </script>

</body>
</html>
