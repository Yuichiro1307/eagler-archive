<!DOCTYPE html>

<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>Loading...</title>
</head>
<body>

<script>
(async () => {
  try {
    // 同じディレクトリの a.html を取得
    const response = await fetch("./e112.html");

    if (!response.ok) {
      throw new Error(`a.html の読み込みに失敗しました: ${response.status}`);
    }

    const html = await response.text();

    // 新しい about:blank を開く
    const newWindow = window.open("about:blank", "_blank");

    if (!newWindow) {
      throw new Error("Please Enabled Popup");
    }

    // about:blank に a.html の内容を書き込む
    newWindow.document.open();
    newWindow.document.write(html);
    newWindow.document.close();

  } catch (error) {
    console.error(error);
  }
})();
</script>

</body>
</html>
