<!DOCTYPE html>

<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Loading...</title>

  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
    }

    body {
      background: #0066ff;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-family: Arial, Helvetica, sans-serif;
    }

    #loading {
      font-size: 8vw;
      font-weight: bold;
      text-align: center;
      user-select: none;
    }
  </style>

</head>

<body>
  <div id="loading">Fetching....</div>

  <script>
    (async () => {
      try {
        // e112u3.html を取得
        const response = await fetch("./e112u3.html");

        if (!response.ok) {
          throw new Error(
            `e112u3.html の読み込みに失敗しました: ${response.status}`
          );
        }

        const html = await response.text();

        // 新しい about:blank を開く
        const newWindow = window.open("about:blank", "_blank");

        if (!newWindow) {
          throw new Error(
            "新しいウィンドウを開けませんでした。ポップアップがブロックされている可能性があります。"
          );
        }

        // about:blank に e112u3.html の内容を埋め込む
        newWindow.document.open();
        newWindow.document.write(html);
        newWindow.document.close();

        // 元の index.html を閉じる
        window.close();

        // window.close() がブラウザに拒否された場合の対策
        setTimeout(() => {
          location.replace("about:blank");
        }, 100);

      } catch (error) {
        console.error(error);

        document.getElementById("loading").textContent = "Fetch failed.";
      }
    })();
  </script>

</body>
</html>
